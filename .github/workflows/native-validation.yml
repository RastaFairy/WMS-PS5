name: Validación nativa

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-validation.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Traducciones, fuentes y recursos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preparar Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Instalar dependencia de validación PNG
        run: python -m pip install --disable-pip-version-check -r tools/requirements-validation.txt
      - name: Validar traducciones y glifos
        working-directory: native
        run: python tools/check-localization.py --require-fonts
      - name: Validar integración de fuentes y controles
        working-directory: native
        run: python tools/check-mode-font-integration.py
      - name: Validar modo experto y recursos
        working-directory: native
        run: python tools/validate-expert-mode.py
